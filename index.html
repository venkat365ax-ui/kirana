<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kirana Store</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1E5E3A;--brand-soft:#E3F0E4;--accent:#E8A317;--bg:#F6F4EE;--line:#E4E1D8;--ink:#1C1C1A;--muted:#5F625C}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9E6DC;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:170px}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{background:var(--brand);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 20px;display:flex;flex-direction:column;gap:12px}
.hero .small{font-size:12px;opacity:.92;display:flex;align-items:center;gap:4px}
.hero .addr{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:var(--muted);border-radius:12px;padding:0 14px;height:48px}
.search input{border:0;outline:0;flex:1;font-size:16px;background:transparent;color:var(--ink);min-width:0}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.h2{font-size:17px;font-weight:800;margin:0 0 12px}
.h3{font-size:15px;font-weight:800;margin:0 0 10px}
section+section{margin-top:22px}
.stack section+section{margin-top:0}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;text-align:center;line-height:1.25}
.cat-tile{width:100%;aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#2C3A2E}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pcard .thumb{width:100%;height:84px}
.thumb{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2C3A2E;font-size:16px;overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.name{font-size:15px;font-weight:700}
.sm{font-size:12px}.muted{color:var(--muted)}
.price{font-size:15px;font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.prow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;align-items:center;gap:12px}
.prow .thumb{width:60px;height:60px}
.grow{flex:1;min-width:0}
.btn-add{height:44px;min-width:92px;padding:0 16px;border-radius:10px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-weight:800;font-size:14px;cursor:pointer}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;border-radius:10px;min-width:92px}
.stepper button{width:38px;height:44px;border:0;background:transparent;color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.stepper span{font-weight:800;min-width:16px;text-align:center}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px 4px;display:flex;align-items:center;gap:4px}
.bar h1{margin:0;font-size:19px;font-weight:800;flex:1}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:38px;padding:0 16px;border-radius:999px;border:1px solid #D6D2C6;background:#fff;color:var(--ink);font-size:13px;font-weight:600;display:flex;align-items:center;text-decoration:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:48px;padding-top:6px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.nav a.on{color:var(--brand);font-weight:800}
.badge{position:absolute;top:0;right:10px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cartbar{position:fixed;left:0;right:0;max-width:480px;margin:0 auto;bottom:calc(68px + env(safe-area-inset-bottom));padding:0 12px 8px;z-index:9}
.cartbar a{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 18px;border-radius:14px;background:var(--brand);color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.footer-bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;z-index:10}
.big{font-size:20px;font-weight:800}
.btn-primary,.btn-outline,.btn-dark{height:56px;border-radius:14px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;padding:0 20px;cursor:pointer;width:100%;border:0}
.btn-primary{background:var(--brand);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-outline{background:#fff;color:var(--brand);border:1.5px solid var(--brand);height:50px;font-size:15px}
.btn-primary[aria-disabled="true"]{opacity:.45;pointer-events:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#E9E6DC;border-radius:12px;padding:4px}
.seg button{height:44px;border:0;border-radius:9px;background:transparent;color:#4A4D47;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EFECE4}
.line .thumb{width:52px;height:52px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.add-more{display:flex;align-items:center;gap:6px;min-height:48px;font-size:14px;font-weight:700;text-decoration:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.field input,.field textarea{border:1px solid #D6D2C6;border-radius:12px;padding:12px;font-size:16px;font-weight:400;background:#fff;resize:none;width:100%}
.field input:focus,.field textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.bill .r{display:flex;justify-content:space-between;font-size:14px;color:#4A4D47;padding:4px 0}
.bill .t{font-size:16px;font-weight:800;color:var(--ink);border-top:1px solid #EFECE4;margin-top:6px;padding-top:10px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{height:44px;padding:0 14px;border-radius:12px;border:1px solid #D6D2C6;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.slot[aria-pressed="true"]{border:2px solid var(--brand);background:var(--brand-soft);font-weight:700;padding:0 13px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:15px;font-weight:800;padding:0;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:64px;cursor:pointer}
.opt:has(input:checked){border:2px solid var(--brand);padding:13px}
.opt input{width:20px;height:20px;accent-color:var(--brand);margin:0;flex-shrink:0}
.opt b{display:block;font-size:15px}
.tag{font-size:11px;font-weight:800;background:#F6E3B4;padding:4px 8px;border-radius:6px}
.err{color:#B3261E;font-size:14px;font-weight:700;margin:0}
.done-hero{background:var(--brand);color:#fff;padding:calc(44px + env(safe-area-inset-top)) 24px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.done-hero h1{margin:0;font-size:24px;font-weight:800}
.done-hero p{margin:0;font-size:14px;opacity:.92}
.check{width:72px;height:72px;border-radius:50%;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center}
.warn{background:#FFF4D6;border:1px solid #EBC867;border-radius:12px;padding:12px;font-size:13px;color:#5C4400;line-height:1.45}
.info{background:var(--brand-soft);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:64px}
.empty h2{margin:8px 0 0;font-size:18px}
.empty .btn-primary{max-width:240px;margin-top:12px}
.empty-ic{width:72px;height:72px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ocard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ocard .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ocard .btns a,.ocard .btns button{height:44px;border-radius:10px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.pre{white-space:pre-line}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* =========================================================
   EDIT YOUR SHOP DETAILS HERE
   ========================================================= */
const CONFIG = {
  shopName: "ABC Shop",
  whatsappNumber: "919177258091", // shop's WhatsApp: country code + number, no + or spaces (e.g. 919876543210)
  upiId: "",                      // shop's UPI ID (e.g. shopname@okaxis). Leave "" to hide the UPI pay button
  deliveryFee: 0,                 // ₹ charged for home delivery (0 = free)
  minOrder: 0,                    // minimum order value in ₹ (0 = no minimum)
  brand: "#1E5E3A"                // main colour
};

const CATEGORIES = [
  { id: "atta",    name: "Atta & Rice",  mono: "AR", tint: "#F6E9CF" },
  { id: "dal",     name: "Dal & Pulses", mono: "DP", tint: "#FBE3C4" },
  { id: "oil",     name: "Oil & Ghee",   mono: "OG", tint: "#F3EDB8" },
  { id: "masala",  name: "Masala & Salt",mono: "MS", tint: "#F8D9CF" },
  { id: "dairy",   name: "Milk & Dairy", mono: "MD", tint: "#E2EDF6" },
  { id: "snacks",  name: "Snacks",       mono: "SN", tint: "#F4DCE6" },
  { id: "care",    name: "Soap & Care",  mono: "SC", tint: "#E3F0E4" },
  { id: "clean",   name: "Cleaning",     mono: "CL", tint: "#E4E6F4" }
];

/* Sample products and prices — replace with your shop's items.
   popular: true shows the item on the home screen.
   img: optional photo link, e.g. "images/atta.jpg" */
const PRODUCTS = [
  { id: "atta5",    cat: "atta",   name: "Wheat Atta",          size: "5 kg",    price: 260, popular: true },
  { id: "sona5",    cat: "atta",   name: "Sona Masoori Rice",   size: "5 kg",    price: 350, popular: true },
  { id: "basmati",  cat: "atta",   name: "Basmati Rice",        size: "1 kg",    price: 120 },
  { id: "rava",     cat: "atta",   name: "Rava (Sooji)",        size: "500 g",   price: 30 },
  { id: "poha",     cat: "atta",   name: "Poha",                size: "500 g",   price: 35 },
  { id: "toor",     cat: "dal",    name: "Toor Dal",            size: "1 kg",    price: 165, popular: true },
  { id: "moong",    cat: "dal",    name: "Moong Dal",           size: "1 kg",    price: 140 },
  { id: "chana",    cat: "dal",    name: "Chana Dal",           size: "1 kg",    price: 110 },
  { id: "urad",     cat: "dal",    name: "Urad Dal",            size: "1 kg",    price: 150 },
  { id: "masoor",   cat: "dal",    name: "Masoor Dal",          size: "1 kg",    price: 105 },
  { id: "rajma",    cat: "dal",    name: "Rajma",               size: "500 g",   price: 95 },
  { id: "sunoil",   cat: "oil",    name: "Sunflower Oil",       size: "1 L",     price: 155, popular: true },
  { id: "gnoil",    cat: "oil",    name: "Groundnut Oil",       size: "1 L",     price: 190 },
  { id: "musoil",   cat: "oil",    name: "Mustard Oil",         size: "1 L",     price: 170 },
  { id: "ghee",     cat: "oil",    name: "Cow Ghee",            size: "500 ml",  price: 330 },
  { id: "haldi",    cat: "masala", name: "Turmeric Powder",     size: "100 g",   price: 30 },
  { id: "chilli",   cat: "masala", name: "Red Chilli Powder",   size: "100 g",   price: 40 },
  { id: "jeera",    cat: "masala", name: "Jeera",               size: "100 g",   price: 45 },
  { id: "salt",     cat: "masala", name: "Salt",                size: "1 kg",    price: 25 },
  { id: "sugar",    cat: "masala", name: "Sugar",               size: "1 kg",    price: 46, popular: true },
  { id: "tea",      cat: "masala", name: "Tea Powder",          size: "250 g",   price: 140 },
  { id: "milk",     cat: "dairy",  name: "Toned Milk",          size: "500 ml",  price: 28, popular: true },
  { id: "curd",     cat: "dairy",  name: "Curd",                size: "500 g",   price: 35 },
  { id: "paneer",   cat: "dairy",  name: "Paneer",              size: "200 g",   price: 90 },
  { id: "bread",    cat: "dairy",  name: "Bread",               size: "400 g",   price: 45 },
  { id: "eggs",     cat: "dairy",  name: "Eggs",                size: "6 pcs",   price: 42 },
  { id: "biscuit",  cat: "snacks", name: "Glucose Biscuits",    size: "250 g",   price: 30 },
  { id: "mixture",  cat: "snacks", name: "Namkeen Mixture",     size: "200 g",   price: 50 },
  { id: "rusk",     cat: "snacks", name: "Rusk",                size: "200 g",   price: 40 },
  { id: "soap",     cat: "care",   name: "Bath Soap",           size: "100 g",   price: 35 },
  { id: "paste",    cat: "care",   name: "Toothpaste",          size: "150 g",   price: 95 },
  { id: "shampoo",  cat: "care",   name: "Shampoo Sachets",     size: "10 pcs",  price: 20 },
  { id: "coconut",  cat: "care",   name: "Coconut Oil",         size: "200 ml",  price: 90 },
  { id: "detergent",cat: "clean",  name: "Detergent Powder",    size: "1 kg",    price: 120 },
  { id: "dishbar",  cat: "clean",  name: "Dishwash Bar",        size: "200 g",   price: 25 },
  { id: "floor",    cat: "clean",  name: "Floor Cleaner",       size: "500 ml",  price: 99 }
];

const SLOTS = ["As soon as possible", "Today, evening", "Tomorrow, morning"];
const PAYMENTS = [
  { v: "Cash on delivery", sub: "Pay when your items arrive" },
  { v: "UPI", sub: "Pay with any UPI app" },
  { v: "Add to my khata", sub: "Settle later with the shop", tag: "Regulars" }
];

/* ========================================================= */

document.documentElement.style.setProperty("--brand", CONFIG.brand);
document.title = CONFIG.shopName;

const store = {
  get(k, d) { try { const v = localStorage.getItem("kirana_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("kirana_" + k, JSON.stringify(v)); } catch (e) {} }
};
let cart = store.get("cart", {});
let customer = store.get("customer", { name: "", phone: "", address: "" });
let prefs = Object.assign({ mode: "delivery", slot: SLOTS[0], pay: PAYMENTS[0].v }, store.get("prefs", {}));
let orders = store.get("orders", []);
let note = store.get("note", "");
let query = "";
let formError = "";

const $app = document.getElementById("app");
const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
const rupee = n => "₹" + Number(n).toLocaleString("en-IN");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const I = (d, w = 22, sw = 2) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const icon = {
  pin: I('<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>', 14),
  search: I('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', 20),
  home: I('<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>'),
  grid: I('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  cart: I('<path d="M3 4h2l2.4 11.2a1 1 0 001 .8h9.2a1 1 0 001-.8L20 8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>'),
  receipt: I('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  back: I('<path d="M15 5l-7 7 7 7"/>', 22, 2.2),
  next: I('<path d="M9 5l7 7-7 7"/>', 18, 2.4),
  plus: I('<path d="M12 5v14M5 12h14"/>', 18, 2.4),
  check: I('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 36, 2.6),
  chat: I('<path d="M4 5h16v11H9l-5 4z"/>', 20),
  phone: I('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/>', 18)
};

/* ---------- cart helpers ---------- */
const lines = () => Object.entries(cart).filter(([id, q]) => q > 0 && byId[id]).map(([id, q]) => ({ p: byId[id], q, total: byId[id].price * q }));
const count = () => lines().reduce((s, l) => s + l.q, 0);
const itemTotal = () => lines().reduce((s, l) => s + l.total, 0);
const fee = () => (prefs.mode === "delivery" ? CONFIG.deliveryFee : 0);
const grand = () => itemTotal() + fee();
function setQty(id, q) { if (q <= 0) delete cart[id]; else cart[id] = q; store.set("cart", cart); }
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1400); }
const numberSet = () => /^\d{10,15}$/.test(CONFIG.whatsappNumber.replace(/\D/g, "")) && !/X/i.test(CONFIG.whatsappNumber);

/* ---------- small pieces ---------- */
function thumb(p) {
  const c = catOf(p.cat);
  const mono = p.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  return `<div class="thumb" style="background:${c.tint}">${p.img ? `<img src="${esc(p.img)}" alt="">` : esc(mono)}</div>`;
}
function qty(p) {
  const q = cart[p.id] || 0;
  if (!q) return `<button class="btn-add" data-act="inc" data-id="${p.id}" aria-label="Add ${esc(p.name)}">Add</button>`;
  return `<div class="stepper"><button data-act="dec" data-id="${p.id}" aria-label="Remove one ${esc(p.name)}">−</button><span>${q}</span><button data-act="inc" data-id="${p.id}" aria-label="Add one more ${esc(p.name)}">+</button></div>`;
}
const card = p => `<div class="pcard">${thumb(p)}<div><div class="name">${esc(p.name)}</div><div class="sm muted">${esc(p.size)}</div></div><div class="row"><div class="price">${rupee(p.price)}</div>${qty(p)}</div></div>`;
const prow = p => `<div class="prow">${thumb(p)}<div class="grow"><div class="name">${esc(p.name)}</div><div class="sm muted">${esc(p.size)}</div><div class="price">${rupee(p.price)}</div></div>${qty(p)}</div>`;
const backBtn = to => `<a class="icon-btn" href="#${to}" aria-label="Back">${icon.back}</a>`;

function nav(active) {
  const n = count();
  const item = (key, href, ic, label, extra = "") => `<a href="#${href}" class="${active === key ? "on" : ""}" ${active === key ? 'aria-current="page"' : ""}>${ic}${label}${extra}</a>`;
  return `<nav class="nav" aria-label="Main">${item("home", "home", icon.home, "Home")}${item("cat", "cat-" + CATEGORIES[0].id, icon.grid, "Categories")}${item("cart", "cart", icon.cart, "Cart", n ? `<span class="badge">${n}</span>` : "")}${item("orders", "orders", icon.receipt, "Orders")}</nav>`;
}
function cartBar() {
  const n = count();
  if (!n) return "";
  return `<div class="cartbar"><a href="#cart"><span style="display:flex;flex-direction:column"><span class="sm" style="opacity:.9;font-weight:600">${n} item${n > 1 ? "s" : ""}</span><span style="font-size:16px;font-weight:800">${rupee(itemTotal())}</span></span><span style="display:flex;align-items:center;gap:6px;font-weight:800">View cart ${icon.next}</span></a></div>`;
}
function bill() {
  return `<section class="card bill"><h2 class="h3">Bill details</h2>
    <div class="r"><span>Item total</span><span>${rupee(itemTotal())}</span></div>
    <div class="r"><span>Delivery fee</span><span>${prefs.mode === "pickup" ? "—" : fee() ? rupee(fee()) : '<b style="color:var(--brand)">Free</b>'}</span></div>
    <div class="r t"><span>To pay</span><span>${rupee(grand())}</span></div></section>`;
}

/* ---------- screens ---------- */
function viewHome() {
  const addr = prefs.mode === "pickup" ? "You'll collect from the shop" : (customer.address ? customer.address.split("\n")[0] : "Add your address at checkout");
  return `<header class="hero">
      <div><div class="small">${icon.pin} ${prefs.mode === "pickup" ? "Pick up" : "Delivering to"}</div><div class="addr">${esc(addr)}</div></div>
      <h1>${esc(CONFIG.shopName)}</h1>
      <label class="search">${icon.search}<span class="sr">Search groceries</span><input id="q" type="search" placeholder="Search atta, dal, oil, soap…" value="${esc(query)}" autocomplete="off" enterkeyhint="search"></label>
    </header>
    <main class="pad"><div id="results">${homeResults()}</div></main>
    ${cartBar()}${nav("home")}`;
}
function homeResults() {
  const q = query.trim().toLowerCase();
  if (q) {
    const list = PRODUCTS.filter(p => (p.name + " " + catOf(p.cat).name).toLowerCase().includes(q));
    return `<h2 class="h2">${list.length} result${list.length === 1 ? "" : "s"} for “${esc(query.trim())}”</h2>` +
      (list.length ? `<div class="list">${list.map(prow).join("")}</div>` : `<p class="muted">Not found. You can ask for it in the note to the shopkeeper in your cart.</p>`);
  }
  return `<section><h2 class="h2">Shop by category</h2><div class="cats">${CATEGORIES.map(c => `<a class="cat" href="#cat-${c.id}"><span class="cat-tile" style="background:${c.tint}">${esc(c.mono)}</span><span>${esc(c.name)}</span></a>`).join("")}</div></section>
    <section><h2 class="h2">Daily essentials</h2><div class="grid2">${PRODUCTS.filter(p => p.popular).map(card).join("")}</div></section>`;
}
function viewCat(id) {
  const c = catOf(id);
  return `<header class="bar">${backBtn("home")}<h1>${esc(c.name)}</h1></header>
    <div class="chips">${CATEGORIES.map(x => `<a class="chip ${x.id === c.id ? "on" : ""}" href="#cat-${x.id}" ${x.id === c.id ? 'aria-current="page"' : ""}>${esc(x.name)}</a>`).join("")}</div>
    <main class="pad"><div class="list">${PRODUCTS.filter(p => p.cat === c.id).map(prow).join("")}</div></main>
    ${cartBar()}${nav("cat")}`;
}
function modeToggle() {
  return `<div class="seg" role="group" aria-label="Delivery or pick up">
    <button type="button" data-act="mode" data-v="delivery" aria-pressed="${prefs.mode === "delivery"}">Home delivery</button>
    <button type="button" data-act="mode" data-v="pickup" aria-pressed="${prefs.mode === "pickup"}">Pick up at shop</button></div>`;
}
function viewCart() {
  const ls = lines();
  if (!ls.length) return `<header class="bar">${backBtn("home")}<h1>My cart</h1></header>
    <main class="pad empty"><div class="empty-ic">${icon.cart}</div><h2>Your cart is empty</h2><p class="muted" style="margin:0">Add a few items to get started.</p><a class="btn-primary" href="#home">Start shopping</a></main>${nav("cart")}`;
  const short = CONFIG.minOrder && itemTotal() < CONFIG.minOrder;
  return `<header class="bar">${backBtn("home")}<h1>My cart</h1><span class="sm muted" style="font-weight:600">${count()} items</span></header>
    <main class="pad stack">
      ${modeToggle()}
      <section class="card" style="padding:4px 14px">${ls.map(l => `<div class="line">${thumb(l.p)}<div class="grow"><div class="name">${esc(l.p.name)}</div><div class="sm muted">${esc(l.p.size)} · ${rupee(l.p.price)} each</div></div><div class="right">${qty(l.p)}<div class="price">${rupee(l.total)}</div></div></div>`).join("")}
        <a class="add-more" href="#home">${icon.plus} Add more items</a></section>
      <label class="field"><span>Note for the shopkeeper</span><textarea id="note" rows="2" placeholder="e.g. If 1 kg Toor Dal is out of stock, send 2 × 500 g">${esc(note)}</textarea></label>
      ${bill()}
      ${short ? `<div class="warn">Minimum order is ${rupee(CONFIG.minOrder)}. Add ${rupee(CONFIG.minOrder - itemTotal())} more to continue.</div>` : ""}
    </main>
    <div class="footer-bar"><div><div class="sm muted">Total</div><div class="big">${rupee(grand())}</div></div><a class="btn-primary grow" href="#checkout" ${short ? 'aria-disabled="true"' : ""}>Continue</a></div>`;
}
function viewCheckout() {
  if (!lines().length) { location.hash = "#home"; return ""; }
  const del = prefs.mode === "delivery";
  return `<header class="bar">${backBtn("cart")}<h1>Checkout</h1></header>
    <form id="checkout" novalidate>
    <main class="pad stack">
      <section>
        <h2 class="h3">${del ? "Deliver to" : "Your details"}</h2>
        <div class="card stack" style="gap:12px">
          <label class="field"><span>Name</span><input data-cust="name" value="${esc(customer.name)}" autocomplete="name" required></label>
          <label class="field"><span>Mobile number</span><input data-cust="phone" type="tel" inputmode="numeric" value="${esc(customer.phone)}" autocomplete="tel" placeholder="10-digit number" required></label>
          ${del ? `<label class="field"><span>Address</span><textarea data-cust="address" rows="3" autocomplete="street-address" placeholder="House no., street, area, landmark" required>${esc(customer.address)}</textarea></label>`
                : `<div class="info">You'll collect your order from <b>${esc(CONFIG.shopName)}</b>. The shop will message you when it's packed.</div>`}
          <a href="#cart" class="sm" style="font-weight:700">${del ? "Want to pick up instead? Change in cart" : "Want home delivery? Change in cart"}</a>
        </div>
      </section>
      <section>
        <h2 class="h3">${del ? "When should it arrive?" : "When will you pick up?"}</h2>
        <div class="slots">${SLOTS.map(s => `<button type="button" class="slot" data-act="slot" data-v="${esc(s)}" aria-pressed="${prefs.slot === s}">${esc(s)}</button>`).join("")}</div>
      </section>
      <fieldset>
        <legend>How will you pay?</legend>
        ${PAYMENTS.map(p => `<label class="opt"><input type="radio" name="pay" value="${esc(p.v)}" ${prefs.pay === p.v ? "checked" : ""}><span class="grow"><b>${esc(p.v === "Cash on delivery" && !del ? "Cash at the shop" : p.v)}</b><span class="sm muted">${esc(p.sub)}</span></span>${p.tag ? `<span class="tag">${p.tag}</span>` : ""}</label>`).join("")}
      </fieldset>
      ${formError ? `<p class="err" role="alert">${esc(formError)}</p>` : ""}
    </main>
    <div class="footer-bar"><button type="submit" class="btn-primary" style="justify-content:space-between"><span>Place order</span><span>${rupee(grand())}</span></button></div>
    </form>`;
}
function waText(o) {
  const L = [`*New order ${o.id}* – ${CONFIG.shopName}`, "", `Name: ${o.customer.name}`, `Phone: ${o.customer.phone}`];
  L.push(o.mode === "delivery" ? `Home delivery to:\n${o.customer.address}` : "Pick up from shop");
  L.push(`When: ${o.slot}`, "", "*Items*");
  o.lines.forEach((l, i) => L.push(`${i + 1}. ${l.name} (${l.size}) × ${l.q} = ${rupee(l.price * l.q)}`));
  L.push("", `Item total: ${rupee(o.itemTotal)}`);
  if (o.mode === "delivery") L.push(`Delivery: ${o.fee ? rupee(o.fee) : "Free"}`);
  L.push(`*To pay: ${rupee(o.total)}*`, `Payment: ${o.pay}`);
  if (o.note) L.push(`Note: ${o.note}`);
  return L.join("\n");
}
const waUrl = o => `https://wa.me/${CONFIG.whatsappNumber.replace(/\D/g, "")}?text=${encodeURIComponent(waText(o))}`;
const upiUrl = o => `upi://pay?pa=${encodeURIComponent(CONFIG.upiId)}&pn=${encodeURIComponent(CONFIG.shopName)}&am=${o.total}&cu=INR&tn=${encodeURIComponent("Order " + o.id)}`;

function viewDone(id) {
  const o = orders.find(x => x.id === id);
  if (!o) { location.hash = "#home"; return ""; }
  return `<section class="done-hero"><div class="check">${icon.check}</div><h1>Order ready to send</h1>
      <p>Order ${esc(o.id)} · ${o.lines.reduce((s, l) => s + l.q, 0)} items · ${rupee(o.total)}</p></section>
    <main class="pad stack">
      ${numberSet() ? `<div class="info"><b>Last step:</b> tap the button below. WhatsApp opens with your order already typed — just press <b>Send</b>.</div>`
        : `<div class="warn"><b>Shop's WhatsApp number isn't set yet.</b> Open index.html and put the number in <code>whatsappNumber</code> at the top.</div>`}
      <a class="btn-primary" href="${esc(waUrl(o))}" target="_blank" rel="noopener">${icon.chat} Send order on WhatsApp</a>
      ${o.pay === "UPI" && CONFIG.upiId ? `<a class="btn-outline" href="${esc(upiUrl(o))}">Pay ${rupee(o.total)} with UPI</a><p class="sm muted" style="margin:-8px 0 0;text-align:center">UPI ID: ${esc(CONFIG.upiId)}</p>` : ""}
      <section class="card bill"><h2 class="h3">Order summary</h2>
        ${o.lines.map(l => `<div class="r"><span>${esc(l.name)} (${esc(l.size)}) × ${l.q}</span><span>${rupee(l.price * l.q)}</span></div>`).join("")}
        ${o.mode === "delivery" ? `<div class="r"><span>Delivery</span><span>${o.fee ? rupee(o.fee) : "Free"}</span></div>` : ""}
        <div class="r t"><span>To pay · ${esc(o.pay)}</span><span>${rupee(o.total)}</span></div>
        <div class="sm muted pre" style="margin-top:10px">${o.mode === "delivery" ? "Deliver to: " + esc(o.customer.address) : "Pick up from shop"}\nWhen: ${esc(o.slot)}${o.note ? "\nNote: " + esc(o.note) : ""}</div>
      </section>
      ${numberSet() ? `<p class="sm muted" style="margin:0;text-align:center">Questions? Call the shop: <a href="tel:+${CONFIG.whatsappNumber.replace(/\D/g, "")}">+${CONFIG.whatsappNumber.replace(/\D/g, "")}</a></p>` : ""}
      <a class="btn-dark" href="#home">Back to home</a>
    </main>`;
}
function viewOrders() {
  return `<header class="bar">${backBtn("home")}<h1>My orders</h1></header>
    <main class="pad">${!orders.length ? `<div class="empty"><div class="empty-ic">${icon.receipt}</div><h2>No orders yet</h2><p class="muted" style="margin:0">Your past orders will show here.</p></div>`
      : `<div class="list">${orders.map(o => `<div class="ocard">
          <div class="row"><b>Order ${esc(o.id)}</b><span class="sm muted">${new Date(o.date).toLocaleDateString("en-IN", { day: "numeric", month: "short" })}, ${new Date(o.date).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" })}</span></div>
          <div class="sm muted">${o.lines.map(l => esc(l.name) + " × " + l.q).join(", ")}</div>
          <div class="row"><span class="price">${rupee(o.total)}</span><span class="sm muted">${esc(o.pay)}</span></div>
          <div class="btns"><button data-act="reorder" data-id="${esc(o.id)}" style="border:0;background:var(--brand);color:#fff">Order again</button><a href="#done-${esc(o.id)}" style="border:1.5px solid var(--brand);color:var(--brand)">View / resend</a></div>
        </div>`).join("")}</div>`}</main>${nav("orders")}`;
}

/* ---------- router ---------- */
function view() {
  const h = location.hash.replace(/^#/, "") || "home";
  if (h.startsWith("cat-")) return viewCat(h.slice(4));
  if (h.startsWith("done-")) return viewDone(h.slice(5));
  return ({ cart: viewCart, checkout: viewCheckout, orders: viewOrders }[h] || viewHome)();
}
function render() { const y = window.scrollY; $app.innerHTML = view(); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { formError = ""; render(); window.scrollTo(0, 0); });

function placeOrder() {
  const phone = customer.phone.replace(/\D/g, "").replace(/^91(?=\d{10}$)/, "");
  if (!customer.name.trim()) formError = "Please enter your name.";
  else if (!/^\d{10}$/.test(phone)) formError = "Please enter a 10-digit mobile number.";
  else if (prefs.mode === "delivery" && !customer.address.trim()) formError = "Please enter your delivery address.";
  else formError = "";
  if (formError) { render(); const e = document.querySelector(".err"); if (e) e.scrollIntoView({ block: "center" }); return; }
  const o = {
    id: "K" + String(Date.now()).slice(-6),
    date: new Date().toISOString(),
    lines: lines().map(l => ({ id: l.p.id, name: l.p.name, size: l.p.size, price: l.p.price, q: l.q })),
    itemTotal: itemTotal(), fee: fee(), total: grand(),
    mode: prefs.mode, slot: prefs.slot, pay: prefs.pay, note: note.trim(),
    customer: { name: customer.name.trim(), phone, address: customer.address.trim() }
  };
  orders.unshift(o); orders = orders.slice(0, 30); store.set("orders", orders);
  cart = {}; store.set("cart", cart); note = ""; store.set("note", "");
  location.hash = "#done-" + o.id;
}

/* ---------- events ---------- */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const { act, id, v } = b.dataset;
  if (act === "inc") { setQty(id, (cart[id] || 0) + 1); if (cart[id] === 1) toast(byId[id].name + " added"); render(); }
  else if (act === "dec") { setQty(id, (cart[id] || 0) - 1); render(); }
  else if (act === "mode") { prefs.mode = v; store.set("prefs", prefs); render(); }
  else if (act === "slot") { prefs.slot = v; store.set("prefs", prefs); render(); }
  else if (act === "reorder") {
    const o = orders.find(x => x.id === id); if (!o) return;
    o.lines.forEach(l => { if (byId[l.id]) cart[l.id] = (cart[l.id] || 0) + l.q; });
    store.set("cart", cart); location.hash = "#cart";
  }
});
$app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { query = t.value; document.getElementById("results").innerHTML = homeResults(); }
  else if (t.id === "note") { note = t.value; store.set("note", note); }
  else if (t.dataset.cust) { customer[t.dataset.cust] = t.value; store.set("customer", customer); }
});
$app.addEventListener("change", e => { if (e.target.name === "pay") { prefs.pay = e.target.value; store.set("prefs", prefs); } });
$app.addEventListener("submit", e => { if (e.target.id === "checkout") { e.preventDefault(); placeOrder(); } });

render();

/* Offline + install support (works once hosted on https) */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
</script>
</body>
</html>
